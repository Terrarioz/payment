<!doctype html><html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Payment · Yike</title>
<style>
:root{
  --bg:#080808;--s1:#0f0f0f;--s2:#151515;
  --b1:#1c1c1c;--b2:#262626;
  --t1:#f0ede8;--t2:#888;--t3:#3a3a3a;
  --gold:#c4a96a;
  color-scheme:dark;box-sizing:border-box;
}
*,*::before,*::after{box-sizing:inherit}
html,body{margin:0;height:100%;background:var(--bg);color:var(--t1);font:15px/1.6 -apple-system,'Helvetica Neue',sans-serif;-webkit-font-smoothing:antialiased;overflow:hidden}

/* ─── NOISE GRAIN ─── */
body::before{content:'';position:fixed;inset:0;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");opacity:.025;pointer-events:none;z-index:0}

/* ─── STAGE ─── */
#stage{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;z-index:2}

/* NAME */
#name{font-size:clamp(60px,10vw,96px);font-weight:200;letter-spacing:-.03em;color:var(--t1);margin-bottom:4px}
#name em{font-style:italic;color:var(--gold);text-shadow:0 0 40px rgba(196,169,106,.25)}

/* LABEL */
#label{font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--t3);margin-bottom:32px}

/* QR CARD */
#qr-wrap{margin-bottom:24px}
#qr-card{background:#ffffff;border-radius:16px;padding:16px;width:210px;height:210px;display:flex;align-items:center;justify-content:center;box-shadow:0 8px 32px rgba(0,0,0,.4)}
#qr-card img{width:100%;height:100%;object-fit:contain;display:block}

/* INSTRUCTION */
#instr{font-size:13px;color:var(--t2);text-align:center;letter-spacing:.04em;line-height:1.8}
</style></head><body>

<div id="stage">
  <div id="name">Yike<em>.</em></div>
  <div id="label">Session Payment</div>
  <div id="qr-wrap">
    <div id="qr-card">
      <img src="qr.jpg" alt="QR Code">
    </div>
  </div>
  <div id="instr">Scan with Alipay</div>
</div>

</body></html>
